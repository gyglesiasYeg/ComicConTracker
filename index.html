<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Comic Con Tracker V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif}.app{max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(circle at 50% -20%,#18345d 0,#08111f 38%,#050914 100%);padding-bottom:92px}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px;background:rgba(5,9,20,.82);backdrop-filter:blur(20px)}.brand{text-align:center;color:#d9ecff;font-weight:900;letter-spacing:1px;line-height:.9;text-shadow:0 0 12px #378cff}.brand span{font-size:12px;letter-spacing:5px}.icon{border:0;background:#0e1728;color:white;border-radius:14px;padding:10px}.screen{padding:14px 16px}.notice{background:#10213a;border:1px solid #2e6dd0;border-radius:16px;padding:12px;margin-bottom:14px;color:#dcecff;font-size:13px}.seg{display:flex;background:#080d19;border:1px solid #1f2a3d;border-radius:16px;padding:4px;margin-bottom:18px}.seg button{flex:1;border:0;background:transparent;color:#cbd5e1;padding:10px;border-radius:12px;font-weight:700}.seg button:first-child{background:#27344a;color:white}.conCard{position:relative;display:block;width:100%;text-align:left;color:white;border:1px solid;border-radius:20px;margin-bottom:16px;padding:122px 16px 18px;overflow:hidden;box-shadow:0 16px 35px rgba(0,0,0,.35)}.conCard:before,.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.4));pointer-events:none}.poster{position:absolute;top:18px;left:18px;font-size:28px;line-height:.9;font-weight:1000;text-transform:uppercase;max-width:220px;text-shadow:0 4px 20px #000}.pin{position:absolute;right:16px;top:16px}.date{font-size:12px;color:#eef2ff;font-weight:800}.title{font-size:24px;font-weight:900;margin-top:8px}.city{color:#d5d8de}.count{position:absolute;right:16px;top:128px;border:1px solid currentColor;border-radius:14px;padding:8px 12px;text-align:center;background:rgba(0,0,0,.26)}.count b{display:block;font-size:36px;color:#63a9ff}.count span{font-size:11px}.stats{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.15);margin-top:20px;padding-top:16px}.stats span{font-size:19px;font-weight:800}.stats small{display:block;font-size:11px;font-weight:500;color:#d9dee7;margin-top:2px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:15px;color:white;font-weight:900;letter-spacing:.5px;display:flex;justify-content:center;gap:10px;align-items:center}.primary{background:linear-gradient(135deg,#1261cf,#06408f);box-shadow:0 10px 30px rgba(29,99,211,.28)}.secondary{background:#182236;border:1px solid #2b3c57}.last{text-align:center;color:#b9c2d2;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,13,25,.94);border-top:1px solid #1f2d43;backdrop-filter:blur(18px);padding:9px 8px 22px}.nav{border:0;background:transparent;color:#a8b3c5;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.nav.on{color:#4da3ff}.hero{position:relative;border-radius:0 0 28px 28px;padding:150px 18px 22px;margin:-14px -16px 18px;overflow:hidden}.hero h1{font-size:30px;margin:0}.hero p{margin:5px 0;color:#d1d5db}.hero b{color:#65a7ff}.avatar{position:absolute;left:18px;top:88px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#1b66b1;border:2px solid #97c5ff;font-size:32px;font-weight:900}.bigCount{position:absolute;right:18px;bottom:22px;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;text-align:center}.bigCount strong{font-size:36px;display:block}.bigCount span{font-size:11px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.info{background:#101827;border:1px solid #243248;border-radius:18px;padding:12px 6px;text-align:center;color:#dce8fa}.info span{display:block;font-size:11px;margin-top:5px}.card{background:linear-gradient(180deg,rgba(19,29,47,.96),rgba(10,16,28,.96));border:1px solid #1f2d43;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 14px 30px rgba(0,0,0,.22)}h1,h2{margin:0 0 12px}.row{display:grid;grid-template-columns:92px 1fr;gap:10px;border-bottom:1px solid #1d2839;padding:10px 0}.row:last-child{border-bottom:0}.row span{color:#b5c0d1}.row p{margin:0;color:#f1f5f9}.guestStrip{display:flex;gap:12px;overflow:auto;padding-bottom:8px}.mini{min-width:136px;background:#111a2a;border:1px solid #293751;border-radius:16px;padding:10px}.miniPhoto,.photo{background:linear-gradient(135deg,#8b6b44,#20150f);display:grid;place-items:center;color:white;font-weight:900}.miniPhoto{height:118px;border-radius:12px;margin-bottom:10px;font-size:28px}.mini b{display:block}.mini span,.mini p{font-size:12px;color:#c8d1df;margin:4px 0}.search{display:flex;align-items:center;gap:8px;background:#111a2a;border:1px solid #26354d;border-radius:16px;padding:8px 10px;margin-bottom:14px}.search input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:15px}.search button{border:0;background:#1d65d8;color:white;border-radius:12px;padding:8px}.guestCard{display:grid;grid-template-columns:92px 1fr;gap:12px;background:#101827;border:1px solid #26354d;border-radius:20px;padding:12px;margin-bottom:12px}.photo{width:92px;height:126px;border-radius:14px;font-size:30px}.guestInfo h3{margin:0;font-size:18px}.guestInfo p{margin:4px 0;color:#cbd5e1}.guestTop{display:flex;justify-content:space-between;gap:6px}.guestTop button{background:transparent;border:0;color:#ffd84a;font-size:20px}.prices{display:grid;gap:6px;margin:10px 0}.prices span{display:flex;gap:6px;align-items:center;color:white}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips i{font-style:normal;background:#262f3d;border:1px solid #3a4658;border-radius:8px;padding:4px 8px;font-size:11px}.sched{font-size:13px}.ghost{border:1px solid #32425e;background:#0d1424;color:#dbeafe;border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:8px}.budgetTotal{background:linear-gradient(135deg,#153a73,#0b1730);border:1px solid #2f6dd3;border-radius:20px;padding:18px;margin-bottom:16px}.budgetTotal span{color:#c8d7f2}.budgetTotal b{display:block;font-size:42px;margin-top:8px}.input{width:100%;background:#0f1726;border:1px solid #2b3b55;border-radius:12px;color:white;padding:12px;margin-bottom:10px}.small{font-size:12px;color:#aebbd0}.sourceTag{display:inline-block;background:#1b2b44;color:#bfe0ff;border:1px solid #294a74;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:6px}@media(min-width:760px){.app{box-shadow:0 0 0 10px #111827,0 20px 80px rgba(0,0,0,.7);border-radius:32px;margin-top:20px;min-height:900px;overflow:hidden}.bottom{border-radius:0 0 32px 32px}}
</style></head><body><div class="app"><header class="top"><button class="icon">☰</button><div class="brand">COMIC CON<br><span>TRACKER</span></div><button class="icon">🔔</button></header><main id="screen" class="screen"></main><nav class="bottom"><button class="nav on" data-tab="home">🏠<span>Home</span></button><button class="nav" data-tab="guests">👥<span>Guests</span></button><button class="nav" data-tab="schedule">📅<span>Schedule</span></button><button class="nav" data-tab="budget">💳<span>Budget</span></button><button class="nav" data-tab="details">☰<span>More</span></button></nav></div><script>
const DATA_VERSION='2026-07-27-v2-official-start';
const starter=[

['Christopher Judge','God of War','Sat, Sun'],['Kellen Goff','Five Nights at Freddy\'s','Fri, Sat, Sun'],['Luci Christian','Borderlands 2','Fri, Sat, Sun'],['Brad Swaile','Street Fighter X Tekken','Fri, Sat, Sun'],['François Chau','Ghost of Tsushima','Fri, Sat, Sun'],['Ron Perlman','Fallout','Sat, Sun'],['Tom Cook','He-Man and the Masters of the Universe','Fri, Sat, Sun'],['Michael Golden','Legendary Creator','Fri, Sat, Sun'],['Tom Grummett','Legendary Artist','Fri, Sat, Sun'],['Scott Chantler','Three Thieves / Squire and Knight / Bix','Fri, Sat, Sun'],['Danny Fingeroth','Legendary Marvel Writer and Editor','Fri, Sat, Sun'],['Georges Jeanty','Godzilla vs The Avengers / Star Wars: Ahsoka','Fri, Sat, Sun'],['Nat Jones','68','Fri, Sat, Sun'],['Dawn McTeigue','Cover Artist','Fri, Sat, Sun'],['Jeff Monk','Cover Artist','Fri, Sat, Sun'],['Renee Nault','Salvage / The Handmaid\'s Tale','Fri, Sat, Sun'],['Dan Parent','Archie','Fri, Sat, Sun'],['Casey Parsons','Cover Artist / Illustrator','Fri, Sat, Sun'],['Jim Salicrup','Legendary Marvel Editor','Fri, Sat, Sun'],['Jeff Spokes','DC Cover Artist / Red Hood / Jenny Sparks','Fri, Sat, Sun'],['Arthur Suydam','Marvel Zombies / DCeased','Fri, Sat, Sun'],['Renee Witterstaetter','Writer / Editor / Color Artist / Publisher','Fri, Sat, Sun'],['Adriean Koleric','Trakovi','Fri, Sat, Sun'],['Alexander Finbow','Alberta Comics Anthology / Shades of Grey / When Big Bears Invade','Fri, Sat, Sun'],['Collette Turner','Cover Artist','Fri, Sat, Sun'],['Hugh Rookwood','Cover Artist','Fri, Sat, Sun'],['Jarrett Hartnell','Shout Kill Revel','Fri, Sat, Sun'],['Jeff Martin','La Cosa Glasnostra','Fri, Sat, Sun'],['John Fleming','Badassical','Fri, Sat, Sun'],['Kat Simmers','Pass Me By: Lily','Fri, Sat, Sun'],['Larry Hancock','The Silent Invasion','Fri, Sat, Sun'],['Michael Cherkas','Red Harvest / The Silent Invasion','Fri, Sat, Sun'],['Nickolej Villiger','Illustrator / Musician','Fri, Sat, Sun'],['Pierre-Alexandre Comtois','Sunder','Fri, Sat, Sun'],['Ryan Danny Owen','Pass Me By: Lily','Fri, Sat, Sun'],['Sam Noir','Cauldron','Fri, Sat, Sun'],['Sami Francis','Cover Artist','Fri, Sat, Sun'],['Sheldon K. Bueckert','Cover Artist','Fri, Sat, Sun'],['Stefano Jun','Modern Asian Family','Fri, Sat, Sun'],['Wordburglar','Rhymes with Comics','Fri, Sat, Sun'],['John Cena','Wrestling / Peacemaker / Fast & Furious','TBD'],['Karl Urban','The Boys','TBD'],['Erin Moriarty','The Boys','TBD'],['Tomer Capone','The Boys','TBD'],['Colby Minifie','The Boys','TBD'],['Cameron Crovetti','The Boys','TBD'],['Colin O\'Donoghue','Once Upon a Time','TBD'],['Emilie de Ravin','Once Upon a Time','TBD']].map((x,i)=>({id:'edm'+i,name:x[0],fandom:x[1],must:false,hidden:false,auto:0,photo:0,days:x[2].split(', '),schedule:'Schedule/pricing TBD. Check official guest/photo-op page before purchasing.',source:'Official/FAN EXPO listed or official homepage announcement',img:initials(x[0])}))},

];
function initials(n){return n.split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase()}
let saved=localStorage.getItem('comicConStandaloneV2'), cons=saved?JSON.parse(saved):starter, active=cons[0].id, tab='home', last=localStorage.getItem('comicConLastV2')||'Data seeded from official sources on Jul 27, 2026';
if(localStorage.getItem('comicConVersion')!==DATA_VERSION){cons=starter; localStorage.setItem('comicConVersion',DATA_VERSION); save();}
const screen=document.getElementById('screen');function save(){localStorage.setItem('comicConStandaloneV2',JSON.stringify(cons));localStorage.setItem('comicConLastV2',last)}function con(){return cons.find(c=>c.id===active)||cons[0]}function days(s){let d=new Date(s+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);let x=Math.ceil((d-n)/86400000);return x<0?'Started':x}function money(n){return n?'$'+n:'TBD'}function must(c){return c.guests.filter(g=>g.must&&!g.hidden).length}function budget(c){return c.guests.filter(g=>g.must&&!g.hidden).reduce((s,g)=>s+(+g.auto||0)+(+g.photo||0),0)}function refresh(){last=new Date().toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});con().updates++;save();render()}function nav(t){tab=t;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.tab));
function addConvention(){let name=document.getElementById('newName').value.trim();let url=document.getElementById('newUrl').value.trim();if(!name)return;let id='custom'+Date.now();let newCon={id,name,city:'TBD',dates:'TBD',start:'',venue:'TBD',address:'TBD',website:url,guestUrl:url,accessUrl:url,ticketUrl:url,accessibility:'TBD - use Find Official Info to search and update manually.',tickets:'TBD',hero:'linear-gradient(135deg,#2d374d,#0b1220 45%,#222b3d)',accent:'#8ab4ff',source:'Manual add',updates:0,guests:[]};cons.unshift(newCon);active=id;save();nav('details');}
function openSearch(){let c=con();let q=encodeURIComponent(c.name+' official guests dates accessibility schedule autograph photo ops');window.open('https://www.google.com/search?q='+q,'_blank')}
function render(){let c=con(); if(tab==='home')screen.innerHTML=`<div class="notice"><b>Version 2:</b> Sample guests were replaced with sourced convention data. Prices and final schedules remain TBD unless an official source has published them.</div><div class="seg"><button>All Cons</button><button>Upcoming</button><button>Past</button></div>${cons.map(c=>`<button class="conCard" onclick="active='${c.id}';nav('details')" style="background:${c.hero};border-color:${c.accent}"><span class="pin">⭐</span><div class="poster">${c.name}</div><div class="date">${c.dates.toUpperCase()}</div><div class="title">${c.name}</div><div class="city">${c.city}</div><div class="count"><b>${c.start?days(c.start):'TBD'}</b><span>DAYS<br>REMAINING</span></div><div class="stats"><span>👥 ${c.guests.length}<small>Guests</small></span><span>⭐ ${must(c)}<small>Must See</small></span><span>🔔 ${c.updates}<small>Checks</small></span></div></button>`).join('')}<section class="card"><h2>Add New Convention</h2><input id="newName" class="input" placeholder="Convention name"><input id="newUrl" class="input" placeholder="Official website URL, if known"><button class="secondary" onclick="addConvention()">＋ Add Convention</button><p class="small">Future conventions can be added here. This static app cannot silently import web data by itself, but the Find Official Info button will help you search and then you can update fields manually.</p></section><button class="primary" onclick="refresh()">🔄 MANUAL UPDATE CHECK</button><p class="last">Last checked: ${last}</p>`;else if(tab==='details')screen.innerHTML=`<section class="hero" style="background:${c.hero}"><div class="avatar">${c.name[0]}</div><h1>${c.name}</h1><p>${c.city}</p><b>${c.dates}</b><div class="bigCount"><strong>${c.start?days(c.start):'TBD'}</strong><span>DAYS REMAINING</span></div></section><div class="quick"><div class="info">♿<span>Access</span></div><div class="info">👥<span>Guests</span></div><div class="info">📅<span>Schedule</span></div><div class="info">📍<span>Venue</span></div></div><section class="card"><h2>Convention Info</h2><div class="row"><span>Venue</span><p>${c.venue}</p></div><div class="row"><span>Address</span><p>${c.address}</p></div><div class="row"><span>Guests</span><p>${c.guests.length} listed, ${must(c)} must see</p></div><div class="row"><span>Budget</span><p>$${budget(c)} planned</p></div><div class="row"><span>Tickets</span><p>${c.tickets}</p></div><div class="row"><span>Access</span><p>${c.accessibility}</p></div><div class="row"><span>Source</span><p>${c.source}</p></div><button class="primary" onclick="refresh()">🔄 MANUAL UPDATE CHECK</button><button class="secondary" onclick="openSearch()">🔎 Find Official Info</button><p class="last">Last checked: ${last}</p></section><h2>Featured Guests</h2><div class="guestStrip">${c.guests.filter(g=>!g.hidden).slice(0,6).map(g=>`<div class="mini"><div class="miniPhoto">${g.img}</div><b>${g.name}</b><span>${g.fandom}</span><p>${money(g.auto)} Auto</p><p>${money(g.photo)} Photo</p></div>`).join('')}</div>`;else if(tab==='guests')screen.innerHTML=`<div class="search">🔎<input id="q" placeholder="Search visible guests" oninput="renderGuests(this.value)"><button onclick="addGuest()">＋</button></div><div id="guestList"></div>`;else if(tab==='schedule')screen.innerHTML=`<h1>Schedule</h1><div class="notice">Schedules and final appearance times often change. Anything marked TBD should be checked on the official source before you buy or line up.</div>${c.guests.filter(g=>!g.hidden).map(g=>`<section class="card"><h2>${g.name}</h2><p>${g.schedule}</p><p class="chips">${g.days.map(d=>`<i>${d}</i>`).join('')}</p><span class="sourceTag">${g.source}</span></section>`).join('')}`;else if(tab==='budget')screen.innerHTML=`<h1>Budget</h1><section class="budgetTotal"><span>Planned Must-See Total</span><b>$${budget(c)}</b></section><div class="notice">Prices are TBD unless you manually enter confirmed autograph/photo-op prices.</div>${c.guests.filter(g=>g.must&&!g.hidden).map(g=>`<section class="card"><h2>${g.name}</h2><div class="row"><span>Autograph</span><p>${money(g.auto)}</p></div><div class="row"><span>Photo Op</span><p>${money(g.photo)}</p></div><div class="row"><span>Total</span><p>$${(+g.auto||0)+(+g.photo||0)}</p></div></section>`).join('')}`; if(tab==='guests')renderGuests('')}
function renderGuests(q=''){let c=con();document.getElementById('guestList').innerHTML=c.guests.filter(g=>!g.hidden&&(g.name+g.fandom).toLowerCase().includes(q.toLowerCase())).map(g=>`<section class="guestCard"><div class="photo">${g.img}</div><div class="guestInfo"><div class="guestTop"><h3>${g.name}</h3><button onclick="toggleMust('${g.id}')">${g.must?'⭐':'☆'}</button></div><p>${g.fandom}</p><div class="prices"><span>💵 Auto ${money(g.auto)}</span><span>📷 Photo ${money(g.photo)}</span></div><div class="chips">${g.days.map(d=>`<i>${d}</i>`).join('')}</div><p class="sched">${g.schedule}</p><span class="sourceTag">${g.source}</span><button class="ghost" onclick="hideGuest('${g.id}')">🙈 Hide Guest</button></div></section>`).join('') || '<section class="card"><h2>No visible guests</h2><p>No guests match your search or all are hidden.</p></section>'}
function toggleMust(id){let g=con().guests.find(x=>x.id===id);g.must=!g.must;save();render()}function hideGuest(id){let g=con().guests.find(x=>x.id===id);g.hidden=true;save();render()}function addGuest(){con().guests.unshift({id:crypto.randomUUID(),name:'New Guest',fandom:'Guest',must:false,hidden:false,auto:0,photo:0,days:['TBD'],schedule:'TBD',source:'Manual entry',img:'NG'});save();render()}render();
</script></body></html>
