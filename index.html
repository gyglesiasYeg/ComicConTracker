ckground:rgba(0,0,0,.26)}.count b{display:block;font-size:36px;color:#63a9ff}.count span{font-size:11px}.stats{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.15);margin-top:20px;padding-top:16px}.stats span{font-size:19px;font-weight:800}.stats small{display:block;font-size:11px;font-weight:500;color:#d9dee7;margin-top:2px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:15px;color:white;font-weight:900;letter-spacing:.5px;display:flex;justify-content:center;gap:10px;align-items:center}.primary{background:linear-gradient(135deg,#1261cf,#06408f);box-shadow:0 10px 30px rgba(29,99,211,.28)}.secondary{background:#182236;border:1px solid #2b3c57;margin-top:8px}.last{text-align:center;color:#b9c2d2;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,13,25,.94);border-top:1px solid #1f2d43;backdrop-filter:blur(18px);padding:9px 8px 22px}.nav{border:0;background:transparent;color:#a8b3c5;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.nav.on{color:#4da3ff}.hero{position:relative;border-radius:0 0 28px 28px;padding:150px 18px 22px;margin:-14px -16px 18px;overflow:hidden}.hero h1{font-size:30px;margin:0}.hero p{margin:5px 0;color:#d1d5db}.hero b{color:#65a7ff}.avatar{position:absolute;left:18px;top:88px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#1b66b1;border:2px solid #97c5ff;font-size:32px;font-weight:900}.bigCount{position:absolute;right:18px;bottom:22px;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;text-align:center}.bigCount strong{font-size:36px;display:block}.bigCount span{font-size:11px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.info{background:#101827;border:1px solid #243248;border-radius:18px;padding:12px 6px;text-align:center;color:#dce8fa}.info span{display:block;font-size:11px;margin-top:5px}.card{background:linear-gradient(180deg,rgba(19,29,47,.96),rgba(10,16,28,.96));border:1px solid #1f2d43;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 14px 30px rgba(0,0,0,.22)}h1,h2{margin:0 0 12px}.row{display:grid;grid-template-columns:92px 1fr;gap:10px;border-bottom:1px solid #1d2839;padding:10px 0}.row:last-child{border-bottom:0}.row span{color:#b5c0d1}.row p{margin:0;color:#f1f5f9}.guestStrip{display:flex;gap:12px;overflow:auto;padding-bottom:8px}.mini{min-width:148px;background:#111a2a;border:1px solid #293751;border-radius:16px;padding:10px}.miniPhoto,.photo{background:linear-gradient(135deg,#8b6b44,#20150f);display:grid;place-items:center;color:white;font-weight:900;overflow:hidden}.miniPhoto{height:148px;border-radius:12px;margin-bottom:10px;font-size:28px}.miniPhoto img,.photo img{width:100%;height:100%;object-fit:cover}.mini b{display:block}.mini span,.mini p{font-size:12px;color:#c8d1df;margin:4px 0}.search{display:flex;align-items:center;gap:8px;background:#111a2a;border:1px solid #26354d;border-radius:16px;padding:8px 10px;margin-bottom:14px}.search input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:15px}.search button{border:0;background:#1d65d8;color:white;border-radius:12px;padding:8px}.guestCard{display:grid;grid-template-columns:108px 1fr;gap:12px;background:#101827;border:1px solid #26354d;border-radius:20px;padding:12px;margin-bottom:12px}.photo{width:108px;height:150px;border-radius:16px;font-size:30px;box-shadow:0 12px 22px rgba(0,0,0,.35)}.guestInfo h3{margin:0;font-size:18px}.guestInfo p{margin:4px 0;color:#cbd5e1}.guestTop{display:flex;justify-content:space-between;gap:6px}.guestTop button{background:transparent;border:0;color:#ffd84a;font-size:20px}.prices{display:grid;gap:6px;margin:10px 0}.prices span{display:flex;gap:6px;align-items:center;color:white}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips i{font-style:normal;background:#262f3d;border:1px solid #3a4658;border-radius:8px;padding:4px 8px;font-size:11px}.sched{font-size:13px}.ghost{border:1px solid #32425e;background:#0d1424;color:#dbeafe;border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:8px}.budgetTotal{background:linear-gradient(135deg,#153a73,#0b1730);border:1px solid #2f6dd3;border-radius:20px;padding:18px;margin-bottom:16px}.budgetTotal span{color:#c8d7f2}.budgetTotal b{display:block;font-size:42px;margin-top:8px}.input{width:100%;background:#0f1726;border:1px solid #2b3b55;border-radius:12px;color:white;padding:12px;margin-bottom:10px}.small{font-size:12px;color:#aebbd0}.sourceTag{display:inline-block;background:#1b2b44;color:#bfe0ff;border:1px solid #294a74;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:6px}.photoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tinyBtn{border:1px solid #32425e;background:#0d1424;color:#dbeafe;border-radius:10px;padding:7px 8px;font-size:12px}@media(min-width:760px){.app{box-shadow:0 0 0 10px #111827,0 20px 80px rgba(0,0,0,.7);border-radius:32px;margin-top:20px;min-height:900px;overflow:hidden}.bottom{border-radius:0 0 32px 32px}}
</style></head><body><div class="app"><header class="top"><button class="icon">☰</button><div class="brand">COMIC CON<br><span>TRACKER</span></div><button class="icon">🔔</button></header><main id="screen" class="screen"></main><nav class="bottom"><button class="nav on" data-tab="home">🏠<span>Home</span></button><button class="nav" data-tab="guests">👥<span>Guests</span></button><button class="nav" data-tab="schedule">📅<span>Schedule</span></button><button class="nav" data-tab="budget">💳<span>Budget</span></button><button class="nav" data-tab="details">☰<span>More</span></button></nav></div><script>
const DATA_VERSION='2026-07-27-v3-photo-support';

const officialPhotos={

 return {id:crypto.randomUUID(),name,fandom,must:false,hidden:false,auto,photo,days:days.split(', '),schedule:'Schedule/pricing may change. Check official guest/photo-op page before purchasing.',source,img:initials(name),photoUrl:officialPhotos[name]||''};
}
const starter=[
{id:'edm',name:'Edmonton Expo',city:'Edmonton, Alberta, Canada',dates:'Sept 18 - 20, 2026',start:'2026-09-18',venue:'Edmonton EXPO Centre',address:'7515 118 Ave NW, Edmonton, AB T5B 0J2',website:'https://fanexpohq.com/edmontonexpo/',guestUrl:'https://fanexpohq.com/edmontonexpo/all-guests/',accessUrl:'https://fanexpohq.com/edmontonexpo/accessibility/',ticketUrl:'https://fanexpohq.com/edmontonexpo/buy-tickets/',accessibility:'Official policy references an Accessibility Services Desk and medical stickers. Edmonton EXPO Centre venue accessibility includes accessible parking, courtesy phones, accessible water fountains, elevators, limited wheelchair transport support, and service animals in public areas. Verify before attending.',tickets:'3-day pass listed as Advanced $69 / Regular $89; Ultimate Fan Package Advanced $99 / Regular $119; VIP Package $299 only available in advance. Ticket prices may change.',hero:'linear-gradient(135deg,#12335f,#0b1220 45%,#203a5e)',accent:'#4da3ff',source:'FAN EXPO HQ / FanCons / Edmonton EXPO Centre',updates:0,guests:[
 guest('Christopher Judge','Stargate / God of War','Sat, Sun',85,85,'Official Edmonton guest page and image from FAN EXPO network'),

 guest('John Cena','WWE / Peacemaker / Fast & Furious','TBD',0,0,'Official Edmonton homepage announcement'),
 guest('Erin Moriarty','The Boys','TBD'), guest('Tomer Capone','The Boys','TBD'), guest('Colby Minifie','The Boys','TBD'), guest('Cameron Crovetti','The Boys','TBD'), guest('Colin O\'Donoghue','Once Upon a Time','TBD'), guest('Emilie de Ravin','Once Upon a Time','TBD'),
 guest('Kellen Goff','Five Nights at Freddy\'s','Fri, Sat, Sun'), guest('Luci Christian','Borderlands 2','Fri, Sat, Sun'), guest('Brad Swaile','Street Fighter X Tekken','Fri, Sat, Sun'), guest('François Chau','Ghost of Tsushima','Fri, Sat, Sun'), guest('Tom Cook','He-Man and the Masters of the Universe','Fri, Sat, Sun'), guest('Michael Golden','Legendary Creator','Fri, Sat, Sun'), guest('Tom Grummett','Legendary Artist','Fri, Sat, Sun'), guest('Scott Chantler','Three Thieves / Squire and Knight / Bix','Fri, Sat, Sun'), guest('Danny Fingeroth','Legendary Marvel Writer and Editor','Fri, Sat, Sun'), guest('Georges Jeanty','Godzilla vs The Avengers / Star Wars: Ahsoka','Fri, Sat, Sun'), guest('Nat Jones','68','Fri, Sat, Sun'), guest('Dawn McTeigue','Cover Artist','Fri, Sat, Sun'), guest('Jeff Monk','Cover Artist','Fri, Sat, Sun'), guest('Renee Nault','Salvage / The Handmaid\'s Tale','Fri, Sat, Sun'), guest('Dan Parent','Archie','Fri, Sat, Sun'), guest('Casey Parsons','Cover Artist / Illustrator','Fri, Sat, Sun'), guest('Jim Salicrup','Legendary Marvel Editor','Fri, Sat, Sun'), guest('Jeff Spokes','DC Cover Artist / Red Hood / Jenny Sparks','Fri, Sat, Sun'), guest('Arthur Suydam','Marvel Zombies / DCeased','Fri, Sat, Sun'), guest('Renee Witterstaetter','Writer / Editor / Color Artist / Publisher','Fri, Sat, Sun'), guest('Wordburglar','Rhymes with Comics','Fri, Sat, Sun')]
},
{id:'cal',name:'Calgary Expo',city:'Calgary, Alberta, Canada',dates:'Apr 22 - 25, 2027',start:'2027-04-22',venue:'Stampede Park',address:'Stampede Park, Calgary, AB',website:'https://fanexpohq.com/calgaryexpo/',guestUrl:'https://fanexpohq.com/calgaryexpo/celebrities/',accessUrl:'https://fanexpohq.com/calgaryexpo/accessibility/',ticketUrl:'',accessibility:'Official accessibility policy says fans with accessibility needs can use the Accessibility Services Desk; FAN EXPO HQ provides medical stickers; medical companions/support persons may request complimentary single-day admission at the desk; seating is first-come, first-served and not guaranteed.',tickets:'Tickets are coming soon according to the official Calgary Expo planning article.',hero:'linear-gradient(135deg,#5f1222,#180b14 45%,#3a1020)',accent:'#ff4d6d',source:'FAN EXPO HQ / Calgary Expo help center',updates:0,guests:[{id:'calpending',name:'No guests announced yet',fandom:'Official Calgary Expo 2027 guest announcements are still coming.',must:false,hidden:false,auto:0,photo:0,days:['TBD'],schedule:'Guest announcements will be listed on the official Calgary Expo website once they begin.',source:'Calgary Expo FAQ',img:'TBD',photoUrl:''}]},
{id:'nyc',name:'New York Comic Con',city:'New York, New York, USA',dates:'Oct 8 - 11, 2026',start:'2026-10-08',venue:'Javits Center',address:'429 11th Ave, New York, NY',website:'https://www.newyorkcomiccon.com/',guestUrl:'https://www.newyorkcomiccon.com/en-us/guests.html',accessUrl:'https://www.newyorkcomiccon.com/en-us/about/ada-assistance-program.html',ticketUrl:'https://www.newyorkcomiccon.com/en-us/tickets.html',accessibility:'NYCC states it is welcoming to individuals of all abilities and is a fully accessible event. ADA Desk is at Registration; ADA stickers are picked up on-site only and do not provide admission. Official page lists an ADA entrance at the Blue Crystal Palace Entrance.',tickets:'Ticket/pricing details should be checked on the official NYCC ticket page.',hero:'linear-gradient(135deg,#0f3a66,#0b1220 45%,#142c55)',accent:'#3d8bff',source:'NYCC official site / ReedPop announcement coverage',updates:0,guests:[guest('Hayden Christensen','Star Wars','TBD'),guest('Ian McDiarmid','Star Wars','TBD'),guest('Lena Headey','Game of Thrones / 300','TBD'),guest('Jamie Campbell Bower','Stranger Things / Camelot','TBD'),guest('Frank Miller','Comic Creator','TBD'),guest('Jim Lee','Comic Creator','TBD'),guest('Scott Snyder','Comic Creator','TBD'),guest('Rick Riordan','Author','TBD')]}
];
let saved=localStorage.getItem('comicConStandaloneV3'), cons=saved?JSON.parse(saved):starter, active=cons[0].id, tab='home', last=localStorage.getItem('comicConLastV3')||'Data seeded from official sources on Jul 27, 2026';
if(localStorage.getItem('comicConVersion')!==DATA_VERSION){cons=starter; localStorage.setItem('comicConVersion',DATA_VERSION); save();}
const screen=document.getElementById('screen');function save(){localStorage.setItem('comicConStandaloneV3',JSON.stringify(cons));localStorage.setItem('comicConLastV3',last)}function con(){return cons.find(c=>c.id===active)||cons[0]}function days(s){let d=new Date(s+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);let x=Math.ceil((d-n)/86400000);return x<0?'Started':x}function money(n){return n?'$'+n:'TBD'}function must(c){return c.guests.filter(g=>g.must&&!g.hidden).length}function budget(c){return c.guests.filter(g=>g.must&&!g.hidden).reduce((s,g)=>s+(+g.auto||0)+(+g.photo||0),0)}function refresh(){last=new Date().toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});con().updates++;save();render()}function nav(t){tab=t;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.tab));
function guestPhoto(g,cls='photo'){return `<div class="${cls}">${g.photoUrl?`<img src="${g.photoUrl}" alt="${g.name}" onerror="this.remove();this.parentElement.textContent='${g.img}'">`:g.img}</div>`}
function addConvention(){let name=document.getElementById('newName').value.trim();let url=document.getElementById('newUrl').value.trim();if(!name)return;let id='custom'+Date.now();let newCon={id,name,city:'TBD',dates:'TBD',start:'',venue:'TBD',address:'TBD',website:url,guestUrl:url,accessUrl:url,ticketUrl:url,accessibility:'TBD - use Find Official Info to search and update manually.',tickets:'TBD',hero:'linear-gradient(135deg,#2d374d,#0b1220 45%,#222b3d)',accent:'#8ab4ff',source:'Manual add',updates:0,guests:[]};cons.unshift(newCon);active=id;save();nav('details');}
function openSearch(){let c=con();let q=encodeURIComponent(c.name+' official guests photos dates accessibility schedule autograph photo ops');window.open('https://www.google.com/search?q='+q,'_blank')}
function render(){let c=con(); if(tab==='home')screen.innerHTML=`<div class="notice"><b>Version 3:</b> Guest cards now support real photo URLs. Where I could verify FAN EXPO network image URLs, I added them. Everyone else keeps a clean initials placeholder until a photo URL is added.</div><div class="seg"><button>All Cons</button><button>Upcoming</button><button>Past</button></div>${cons.map(c=>`<button class="conCard" onclick="active='${c.id}';nav('details')" style="background:${c.hero};border-color:${c.accent}"><span class="pin">⭐</span><div class="poster">${c.name}</div><div class="date">${c.dates.toUpperCase()}</div><div class="title">${c.name}</div><div class="city">${c.city}</div><div class="count"><b>${c.start?days(c.start):'TBD'}</b><span>DAYS<br>REMAINING</span></div><div class="stats"><span>👥 ${c.guests.length}<small>Guests</small></span><span>⭐ ${must(c)}<small>Must See</small></span><span>🖼️ ${c.guests.filter(g=>g.photoUrl).length}<small>Photos</small></span></div></button>`).join('')}<section class="card"><h2>Add New Convention</h2><input id="newName" class="input" placeholder="Convention name"><input id="newUrl" class="input" placeholder="Official website URL, if known"><button class="secondary" onclick="addConvention()">＋ Add Convention</button><p class="small">For future conventions, add the website and use Find Official Info to search. A static GitHub Pages site can display photos but cannot automatically harvest them silently.</p></section><button class="primary" onclick="refresh()">🔄 MANUAL UPDATE CHECK</button><p class="last">Last checked: ${last}</p>`;else if(tab==='details')screen.innerHTML=`<section class="hero" style="background:${c.hero}"><div class="avatar">${c.name[0]}</div><h1>${c.name}</h1><p>${c.city}</p><b>${c.dates}</b><div class="bigCount"><strong>${c.start?days(c.start):'TBD'}</strong><span>DAYS REMAINING</span></div></section><div class="quick"><div class="info">♿<span>Access</span></div><div class="info">👥<span>Guests</span></div><div class="info">📅<span>Schedule</span></div><div class="info">📍<span>Venue</span></div></div><section class="card"><h2>Convention Info</h2><div class="row"><span>Venue</span><p>${c.venue}</p></div><div class="row"><span>Address</span><p>${c.address}</p></div><div class="row"><span>Guests</span><p>${c.guests.length} listed, ${must(c)} must see, ${c.guests.filter(g=>g.photoUrl).length} with photos</p></div><div class="row"><span>Budget</span><p>$${budget(c)} planned</p></div><div class="row"><span>Tickets</span><p>${c.tickets}</p></div><div class="row"><span>Access</span><p>${c.accessibility}</p></div><div class="row"><span>Source</span><p>${c.source}</p></div><button class="primary" onclick="refresh()">🔄 MANUAL UPDATE CHECK</button><button class="secondary" onclick="openSearch()">🔎 Find Official Info / Photos</button><p class="last">Last checked: ${last}</p></section><h2>Featured Guests</h2><div class="guestStrip">${c.guests.filter(g=>!g.hidden).slice(0,8).map(g=>`<div class="mini">${guestPhoto(g,'miniPhoto')}<b>${g.name}</b><span>${g.fandom}</span><p>${money(g.auto)} Auto</p><p>${money(g.photo)} Photo</p></div>`).join('')}</div>`;else if(tab==='guests')screen.innerHTML=`<div class="search">🔎<input id="q" placeholder="Search visible guests" oninput="renderGuests(this.value)"><button onclick="addGuest()">＋</button></div><div id="guestList"></div>`;else if(tab==='schedule')screen.innerHTML=`<h1>Schedule</h1><div class="notice">Schedules and final appearance times often change. Anything marked TBD should be checked on the official source before you buy or line up.</div>${c.guests.filter(g=>!g.hidden).map(g=>`<section class="card"><h2>${g.name}</h2><p>${g.schedule}</p><p class="chips">${g.days.map(d=>`<i>${d}</i>`).join('')}</p><span class="sourceTag">${g.source}</span></section>`).join('')}`;else if(tab==='budget')screen.innerHTML=`<h1>Budget</h1><section class="budgetTotal"><span>Planned Must-See Total</span><b>$${budget(c)}</b></section><div class="notice">Prices are TBD unless confirmed or manually entered.</div>${c.guests.filter(g=>g.must&&!g.hidden).map(g=>`<section class="card"><h2>${g.name}</h2><div class="row"><span>Autograph</span><p>${money(g.auto)}</p></div><div class="row"><span>Photo Op</span><p>${money(g.photo)}</p></div><div class="row"><span>Total</span><p>$${(+g.auto||0)+(+g.photo||0)}</p></div></section>`).join('')}`; if(tab==='guests')renderGuests('')}
function renderGuests(q=''){let c=con();document.getElementById('guestList').innerHTML=c.guests.filter(g=>!g.hidden&&(g.name+g.fandom).toLowerCase().includes(q.toLowerCase())).map(g=>`<section class="guestCard">${guestPhoto(g)}<div class="guestInfo"><div class="guestTop"><h3>${g.name}</h3><button onclick="toggleMust('${g.id}')">${g.must?'⭐':'☆'}</button></div><p>${g.fandom}</p><div class="prices"><span>💵 Auto ${money(g.auto)}</span><span>📷 Photo ${money(g.photo)}</span></div><div class="chips">${g.days.map(d=>`<i>${d}</i>`).join('')}</div><p class="sched">${g.schedule}</p><span class="sourceTag">${g.photoUrl?'Photo URL set':'No photo yet'}</span><span class="sourceTag">${g.source}</span><div class="photoActions"><button class="tinyBtn" onclick="editPhoto('${g.id}')">Add/Edit Photo</button><button class="tinyBtn" onclick="hideGuest('${g.id}')">Hide</button></div></div></section>`).join('') || '<section class="card"><h2>No visible guests</h2><p>No guests match your search or all are hidden.</p></section>'}
function editPhoto(id){let g=con().guests.find(x=>x.id===id);let url=prompt('Paste image URL for '+g.name, g.photoUrl||''); if(url!==null){g.photoUrl=url.trim();save();render()}}
function toggleMust(id){let g=con().guests.find(x=>x.id===id);g.must=!g.must;save();render()}function hideGuest(id){let g=con().guests.find(x=>x.id===id);g.hidden=true;save();render()}function addGuest(){con().guests.unshift({id:crypto.randomUUID(),name:'New Guest',fandom:'Guest',must:false,hidden:false,auto:0,photo:0,days:['TBD'],schedule:'TBD',source:'Manual entry',img:'NG',photoUrl:''});save();render()}render();
